name: Supabase

# The Storage bucket and policies for published token links (#143), checked
# against a local Supabase stack. Only when they change, since starting the
# stack pulls several Docker images; not a required check for that reason.
on:
  pull_request:
    branches: ['main']
    paths:
      - 'supabase/**'
      - 'scripts/check-supabase-storage.mjs'
      - '.github/workflows/supabase.yml'
  push:
    branches: ['main']
    paths:
      - 'supabase/**'
      - 'scripts/check-supabase-storage.mjs'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policies:
    name: Storage policies
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Setup the Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.120.0
      - name: Start Supabase # Only the database, auth, storage and the gateway
        run: supabase start -x realtime,studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta
      - name: Test the policies in SQL
        run: supabase test db
      - name: Check the Storage API over HTTP
        run: npm run check:supabase
